# The client has only an AWS account: a VPC, an EKS cluster, the landing
# pieces, then the tenant chart.
id: aws-account-kubernetes
title: New VPC and EKS cluster
cloud: aws
mode: account_only
target: kubernetes
inputs:
  - {name: vpc_cidr, label: "VPC CIDR (a /16)", default: "10.42.0.0/16", pattern: "^(\\d{1,3}\\.){3}\\d{1,3}/16$"}
  - {name: kubernetes_version, label: "Kubernetes version", default: "1.33", pattern: "^1\\.[0-9]{2}$"}
stacks:
  - name: network
    role: service
    spec: |
      modules:
        - name: vpc
          module: aws-vpc
          inputs:
            name: {{ .Name }}
            cidr: {{ .Inputs.vpc_cidr }}
            azs: {{ json (azs .Region 3) }}
            private_subnets: [{{ subnet .Inputs.vpc_cidr 3 0 | json }}, {{ subnet .Inputs.vpc_cidr 3 1 | json }}, {{ subnet .Inputs.vpc_cidr 3 2 | json }}]
            public_subnets: [{{ subnet .Inputs.vpc_cidr 6 24 | json }}, {{ subnet .Inputs.vpc_cidr 6 25 | json }}, {{ subnet .Inputs.vpc_cidr 6 26 | json }}]
            enable_nat_gateway: true
            single_nat_gateway: {{ .Size.single_nat }}
            tags: {srustiops-workspace: {{ .Slug }}}
  - name: cluster
    role: service
    spec: |
      modules:
        - name: eks
          module: aws-eks
          inputs:
            name: {{ .Name }}
            kubernetes_version: {{ json .Inputs.kubernetes_version }}
            vpc_id: {"$ref": "stack/{{ stack "network" }}/vpc.vpc_id"}
            subnet_ids: {"$ref": "stack/{{ stack "network" }}/vpc.private_subnets"}
            enable_cluster_creator_admin_permissions: true
            eks_managed_node_groups:
              srustiops:
                instance_types: {{ json .Size.node_types }}
                min_size: {{ .Size.nodes_min }}
                max_size: {{ .Size.nodes_max }}
                desired_size: {{ .Size.nodes_min }}
            tags: {srustiops-workspace: {{ .Slug }}}
  - name: landing
    role: data
    spec: |
      modules:
        - name: landing
          module: aws-srustiops-landing
          inputs:
            name: {{ .Name }}
            vpc_id: {"$ref": "stack/{{ stack "network" }}/vpc.vpc_id"}
            vpc_cidr: {{ .Inputs.vpc_cidr }}
            private_subnet_ids: {"$ref": "stack/{{ stack "network" }}/vpc.private_subnets"}
            eks_oidc_provider_arn: {"$ref": "stack/{{ stack "cluster" }}/eks.oidc_provider_arn"}
            eks_oidc_issuer: {"$ref": "stack/{{ stack "cluster" }}/eks.cluster_oidc_issuer_url"}
            db_instance_class: {{ .Size.db_instance_class }}
            db_multi_az: {{ .Size.db_multi_az }}
            tags: {srustiops-workspace: {{ .Slug }}}
  - name: install
    role: install
    spec: |
      modules:
        - name: install
          module: aws-srustiops-eks-install
          inputs:
            tenant: {{ .Slug }}
            cluster_name: {"$ref": "stack/{{ stack "cluster" }}/eks.cluster_name"}
            chart_repository: {{ json .Platform.ChartRepository }}
            chart_version: {{ json .Platform.ChartVersion }}
            image_repo: {{ json .Platform.ImageRepo }}
            image_tag: {{ json .Platform.ImageTag }}
            gateway_url: {{ json .Platform.GatewayURL }}
            central_url: {{ json .Platform.CentralURL }}
            gateway_ca: {{ json .Platform.GatewayCA }}
            install_token: {{ json .InstallToken }}
            replicas: {{ .Size.replicas }}
            database_endpoint: {"$ref": "stack/{{ stack "landing" }}/landing.database_endpoint"}
            database_password_secret_arn: {"$ref": "stack/{{ stack "landing" }}/landing.database_password_secret_arn"}
            bucket: {"$ref": "stack/{{ stack "landing" }}/landing.bucket"}
            tenant_role_arn: {"$ref": "stack/{{ stack "landing" }}/landing.tenant_role_arn"}
            runner_role_arn: {"$ref": "stack/{{ stack "landing" }}/landing.runner_role_arn"}
