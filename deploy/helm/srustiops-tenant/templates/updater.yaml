{{- if .Values.updater.enabled }}
# The updater applies the version central's fleet rollouts give this
# workspace: it rolls the tenant and runner Deployments to the new image tag
# and waits until every replica is ready. It may only read and patch those
# two Deployments.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-updater
  labels: {{- include "tenant.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-updater
  labels: {{- include "tenant.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["{{ include "tenant.name" . }}", "{{ .Release.Name }}-runner"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-updater
  labels: {{- include "tenant.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ .Release.Name }}-updater }
subjects:
  - { kind: ServiceAccount, name: {{ .Release.Name }}-updater, namespace: {{ .Release.Namespace }} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-updater
  labels: {{- include "tenant.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: srustiops-updater, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: srustiops-updater, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      serviceAccountName: {{ .Release.Name }}-updater
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: updater
          image: "{{ .Values.image.server }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["updater", "-mode", "k8s", "-every", {{ .Values.updater.every | quote }}]
          env:
            - { name: SRUSTIOPS_DATABASE_URL_FILE, value: /secrets/database-url }
            - { name: SRUSTIOPS_UPDATER_DEPLOYMENTS, value: "{{ include "tenant.name" . }},{{ .Release.Name }}-runner" }
          securityContext: {{- include "srustiops.securityContext" . | nindent 12 }}
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } }
          volumeMounts:
            - { name: secrets, mountPath: /secrets, readOnly: true }
      volumes:
        - name: secrets
          secret: { secretName: {{ .Values.existingSecret }}, defaultMode: 0440 }
{{- end }}
