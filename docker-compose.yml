services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: srustiops }
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck: { test: [CMD, pg_isready, -U, postgres], interval: 3s, retries: 20 }
  tenant:
    image: docker.io/mukkarapavankumarreddy/srustiops-server:0.4.0
    command: [tenant]
    user: "${PUID}:${PGID}"
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      SRUSTIOPS_TENANT: docker
      SRUSTIOPS_LISTEN: ":8443"
      SRUSTIOPS_PUBLIC_URL: https://tenant:8443
      SRUSTIOPS_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/srustiops?sslmode=disable
      SRUSTIOPS_MASTER_KEY_FILE: /srustiops/keys/master-key
      SRUSTIOPS_TLS_CERT: /srustiops/tls/tls.crt
      SRUSTIOPS_TLS_KEY: /srustiops/tls/tls.key
      SRUSTIOPS_CENTRAL_URL: https://host.docker.internal:8091
      SRUSTIOPS_CENTRAL_ISSUER: http://127.0.0.1:8090
      SRUSTIOPS_CENTRAL_CA_FILE: /srustiops/gateway-ca.pem
      SRUSTIOPS_CENTRAL_CLIENT_CA: /srustiops/central-ca/ca.crt
      SRUSTIOPS_BOOTSTRAP_RUNNER_TOKEN_FILE: /srustiops/keys/runner-token
    volumes: [./srustiops:/srustiops:ro]
    depends_on: { postgres: { condition: service_healthy } }
  link:
    image: docker.io/mukkarapavankumarreddy/srustiops-server:0.4.0
    command: [link]
    user: "${PUID}:${PGID}"
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      SRUSTIOPS_TENANT: docker
      SRUSTIOPS_LINK_URL: https://host.docker.internal:8091
      SRUSTIOPS_LINK_TARGET: tenant:8443
      SRUSTIOPS_LINK_STATE_DIR: /state
      SRUSTIOPS_LINK_ENROLL_TOKEN_FILE: /srustiops/link-enroll/token
      SRUSTIOPS_LINK_SERVER_CA: /srustiops/gateway-ca.pem
    volumes: [./srustiops:/srustiops:ro, ./link-state:/state]
    depends_on: [tenant]
  runner:
    image: docker.io/mukkarapavankumarreddy/srustiops-runner:0.4.0
    command: [runner]
    user: "${PUID}:${PGID}"
    environment:
      SRUSTIOPS_SERVER_URL: https://tenant:8443
      SRUSTIOPS_RUNNER_TOKEN_FILE: /srustiops/keys/runner-token
      SRUSTIOPS_STATE_KEY_FILE: /srustiops/keys/state-key
      SRUSTIOPS_CA_FILE: /srustiops/tls/ca.crt
    volumes: [./srustiops:/srustiops:ro]
    depends_on: [tenant]
volumes: { pg: {} }
